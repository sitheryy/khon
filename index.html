		<title>ตามล่าหาสมบัติโขนไทย</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2a1508">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>body{background:#2a1508}#status{background:#2a1508!important}</style>
<script>
// KNet — สะพานเชื่อม Firebase (Realtime Database + Auth) กับเกม Godot
// Godot เรียกฟังก์ชันผ่าน JavaScriptBridge แล้วอ่านสถานะด้วย KNet.poll()
(function () {
  const CFG = {
    apiKey: "AIzaSyCSoIUVxumuQnhRwgGI4KLpVho60fwcI74",
    authDomain: "khon-game-13f5e.firebaseapp.com",
    databaseURL: "https://khon-game-13f5e-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "khon-game-13f5e",
    appId: "1:124274736392:web:25d25e73c464865c1140bd",
  };
  const SHEET_URL = "https://script.google.com/macros/s/AKfycbzpk9kNwlB5hg6bTG7D2HKqRfwphja01jEkb1NGPfjPfu1IoxSLguZUjKe3DrvL0pjmeA/exec";
  const SHEET_KEY = "ayutthaya-khon-2569";
  const TEACHER_EMAIL = "teacher@khon-game.app";

  const K = {
    ready: false, online: false, uid: "", isTeacher: false, error: "",
    players: {}, control: {}, offset: 0, teacherResult: "",
  };
  let db = null, meRef = null;

  function boot() {
    try {
      firebase.initializeApp(CFG);
      db = firebase.database();
      db.ref(".info/connected").on("value", s => { K.online = !!s.val(); });
      db.ref(".info/serverTimeOffset").on("value", s => { K.offset = s.val() || 0; });
      firebase.auth().onAuthStateChanged(u => {
        if (!u) return;
        K.uid = u.uid; K.isTeacher = (u.email === TEACHER_EMAIL); K.ready = true;
        db.ref("game/players").on("value", s => { K.players = s.val() || {}; });
        db.ref("game/control").on("value", s => { K.control = s.val() || {}; });
      });
      firebase.auth().signInAnonymously().catch(e => { K.error = String(e.message || e); });
    } catch (e) { K.error = String(e); }
  }

  window.KNet = {
    poll() { return JSON.stringify(K); },
    now() { return Date.now() + K.offset; },
    teacherLogin(pw) {
      K.teacherResult = "wait";
      firebase.auth().signInWithEmailAndPassword(TEACHER_EMAIL, pw)
        .then(() => { K.teacherResult = "ok"; })
        .catch(() => { K.teacherResult = "fail"; });
    },
    join(json) {
      if (!db || !K.uid) return;
      meRef = db.ref("game/players/" + K.uid);
      meRef.onDisconnect().remove();
      meRef.set(Object.assign(JSON.parse(json), { ts: firebase.database.ServerValue.TIMESTAMP }));
    },
    update(json) { if (meRef) meRef.update(JSON.parse(json)); },
    leave() { if (meRef) meRef.remove(); },
    control(json) {  // ครูเท่านั้น (กฎ Firebase ตรวจซ้ำที่เซิร์ฟเวอร์)
      if (!db || !K.isTeacher) return;
      const d = JSON.parse(json);
      if (d.startIn) { d.startAt = Date.now() + K.offset + d.startIn; delete d.startIn; }
      db.ref("game/control").update(d);
    },
    kick(uid) { if (db && K.isTeacher) db.ref("game/players/" + uid).remove(); },
    clearPlayers() { if (db && K.isTeacher) db.ref("game/players").remove(); },
    sendScore(json) {
      const d = JSON.parse(json); d.secret = SHEET_KEY;
      try { if (db && K.uid) db.ref("scores/" + K.uid).set(Object.assign({}, d, { secret: null, at: firebase.database.ServerValue.TIMESTAMP })); } catch (e) {}
      fetch(SHEET_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(d) }).catch(() => {});
    },
  };
  if (window.firebase) boot(); else window.addEventListener("load", boot);
})();

</script>

	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":3203952,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
